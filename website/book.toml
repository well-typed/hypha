[book]
title = "Hypha"
description = "A Haskell-aware code/doc browser tuned for AI agents and humans alike."
src = "src"
language = "en"

[output.html]
# Custom hypha theme lives in hypha.css (palette lifted from ui/css).
additional-css = ["hypha.css"]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/well-typed/hypha"
edit-url-template = "https://github.com/well-typed/hypha/edit/main/website/{path}"
# GitHub Pages serves a project site under /<repo>/, so the prefix is known
# up front — unlike GitLab Pages, whose URL the instance assigned.
site-url = "/hypha/"

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 20
