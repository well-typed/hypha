# GitLab CI for hypha — 3 GHC versions, build + test
#
# Each GHC version gets its own cabal project file + freeze file:
#   cabal.ghc-<ver>.project       (with-compiler + packages + tests)
#   cabal.ghc-<ver>.project.freeze (pinned dependency versions)
#
# The default cabal.project → cabal.ghc-9.10.3.project (symlink) for
# local development. CI picks the right project file per job.
#
# Docker images: official haskell:* from Docker Hub.
#   9.6.7  → slim (alias for slim-bullseye)
#   9.10.3 → slim-bullseye (no bare -slim alias for 9.10.x)
#   9.12.4 → slim-bookworm  (no bare -slim alias for 9.12.x)

stages:
  - test
  - deploy

variables:
  # Keep cabal's data dir inside the project so GitLab cache can reach it
  CABAL_DIR: "$CI_PROJECT_DIR/.cabal"

# Shared template — each concrete job picks an image + project file
.build:
  stage: test
  before_script:
    - apt-get update && apt-get install -y pkg-config zlib1g-dev
    - cabal user-config init
    - cabal update
  script:
    - cabal build all --enable-tests --project-file=${PROJECT_FILE}
    - cabal test all --project-file=${PROJECT_FILE}
  cache:
    key: "$CI_COMMIT_REF_SLUG-ghc${GHC_VERSION}"
    paths:
      - .cabal/store
      - dist-newstyle
  rules:
    # Run on pushes to any branch (catches MR source branches)
    - if: $CI_PIPELINE_SOURCE == "push"
    # Run on merge request pipelines
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

build-9.6:
  extends: .build
  image: haskell:9.6.7-slim
  variables:
    GHC_VERSION: "9.6.7"
    PROJECT_FILE: "cabal.ghc-9.6.7.project"

build-9.10:
  extends: .build
  image: haskell:9.10.3-slim-bullseye
  variables:
    GHC_VERSION: "9.10.3"
    PROJECT_FILE: "cabal.ghc-9.10.3.project"

build-9.12:
  extends: .build
  image: haskell:9.12-slim-bookworm
  variables:
    GHC_VERSION: "9.12.4"
    PROJECT_FILE: "cabal.ghc-9.12.4.project"

# ---------------------------------------------------------------------------
# Documentation site (mdBook → GitLab Pages)
#
# The docs jobs deliberately use buildpack-deps:*-curl, which ships curl +
# ca-certificates on glibc, so there is NO apt-get step — this keeps the docs
# pipeline independent of the apt/GPG issues that affect the GHC images. The
# mdBook binary is downloaded from its GitHub release (no Rust toolchain).
# Bump MDBOOK_VERSION deliberately when upgrading.
# ---------------------------------------------------------------------------
.docs:
  image: buildpack-deps:bookworm-curl
  variables:
    MDBOOK_VERSION: "0.4.40"
  before_script:
    - curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" -o mdbook.tar.gz
    - tar -xzf mdbook.tar.gz

# Build the book on MRs/pushes: fails the pipeline on a broken SUMMARY,
# missing chapter, or bad config. Does not deploy.
docs-build:
  extends: .docs
  stage: test
  script:
    - ./mdbook build website
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Publish to GitLab Pages from the default branch. GitLab serves the
# `public/` artifact automatically for a job named `pages`.
pages:
  extends: .docs
  stage: deploy
  script:
    - ./mdbook build website --dest-dir "$CI_PROJECT_DIR/public"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH