name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - ghc: "9.6.7"
            project: "cabal.ghc-9.6.7.project"
          - ghc: "9.10.3"
            project: "cabal.ghc-9.10.3.project"
          - ghc: "9.12.4"
            project: "cabal.ghc-9.12.4.project"
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: '3.12'
      - run: cabal update
      - run: cabal build all --enable-tests --project-file=${{ matrix.project }}
      - run: cabal test all --project-file=${{ matrix.project }}